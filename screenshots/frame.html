<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Menu-bar panels are narrow, so copy sits beside the panel instead of above it. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 75% 40%, {{BG1}} 0%, {{BG2}} 65%);
    color: {{TEXT}};
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 0 7vw;
    gap: 5vw;
  }
  h1 { font-size: 4.6vw; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  h2 { font-size: 1.9vw; font-weight: 500; opacity: 0.7; line-height: 1.3; margin-top: 1.6vw; }
  .device { display: flex; justify-content: center; }
  img {
    display: block;
    max-height: 84vh;
    max-width: 100%;
    width: auto;
    min-width: 36vw;
    border-radius: 1.1vw;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 2vw 6vw rgba(0, 0, 0, 0.7);
  }
</style>
</head>
<body class="{{FRAME_CLASS}}">
  <div class="copy">
    <h1>{{HEADLINE}}</h1>
    <h2>{{SUBHEADLINE}}</h2>
  </div>
  <div class="device"><img src="shot.png" alt=""></div>
</body>
</html>
